name: Build and Publish Docker Images

on:
  push:
    branches:
      - review-3 

permissions:
  packages: write
  contents: read
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with: 
          context: ./frontend
          push: true
          tags: ghcr.io/shinqwe/film-react-nest/frontend:${{ github.sha }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with: 
          context: ./backend
          push: true
          tags: ghcr.io/shinqwe/film-react-nest/backend:${{ github.sha }}

      - name: Build and push nginx Docker image
        uses: docker/build-push-action@v4
        with: 
          context: ./nginx
          push: true
          tags: ghcr.io/shinqwe/film-react-nest/nginx:${{ github.sha }}
