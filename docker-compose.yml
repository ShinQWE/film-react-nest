services:
  frontend:
    image: ghcr.io/shinqwe/film-react-nest/frontend:latest
    container_name: frontend
    networks:
      - app-network
    volumes:
      - frontend_dist:/var/www/frontend:ro

  backend:
    image: ghcr.io/shinqwe/film-react-nest/backend:latest
    container_name: backend
    ports:
      - "3000:3000"  
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgres://prac1:prac1@db:5432/prac1
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: prac1
      POSTGRES_PASSWORD: prac1
      POSTGRES_DB: prac1
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: rootT
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - app-network
    restart: always
    volumes:
      - frontend_dist:/var/www/frontend:ro

networks:
  app-network:
    driver: bridge

volumes:
  frontend_dist: