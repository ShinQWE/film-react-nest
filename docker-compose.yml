services:
  frontend:
    build: # для локалки на сервере нет
      context: ./frontend # для локалки на сервере нет
      dockerfile: Dockerfile # для локалки на сервере нет
    image: ghcr.io/shinqwe/film-react-nest/frontend:latest
    container_name: frontend
    networks:
      - app-network

  backend:
    build: # для локалки на сервере нет
      context: ./backend # для локалки на сервере нет
      dockerfile: Dockerfile # для локалки на сервере нет
    image: ghcr.io/shinqwe/film-react-nest/backend:latest
    container_name: backend
    ports:
      - "3000:3000"  
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgres://prac1:prac1@db:5432/prac1
    command: ["sh", "-c", "sleep 10 && npm start"]

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: prac1
      POSTGRES_PASSWORD: prac1
      POSTGRES_DB: prac1
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: rootT
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    build: # для локалки на сервере нет
      context: ./nginx # для локалки на сервере нет
      dockerfile: Dockerfile # для локалки на сервере нет
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/var/www/frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: