services:
  frontend:
    image: ghcr.io/shinqwe/film-react-nest/frontend:latest
    container_name: frontend
    networks:
      - app-network
    volumes:
      - frontend_dist:/app/dist

  backend:
    image: ghcr.io/shinqwe/film-react-nest/backend:latest
    container_name: backend
    depends_on:
      - postgres
    ports:
      - "3000:3000"  
    networks:
      - app-network
    env_file:
      - backend/.env
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: prac1
      POSTGRES_PASSWORD: prac1
      POSTGRES_DB: prac1
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: rootT
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - app-network
    volumes:
      - frontend_dist:/var/www/frontend:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  app-network:
    driver: bridge 

volumes:
  frontend_data: