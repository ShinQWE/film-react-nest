services:
  frontend:
    image: ghcr.io/your-username/film-react-nest-frontend:latest
    container_name: frontend
    networks:
      - app-network

  backend:
    image: ghcr.io/your-username/film-react-nest-backend:latest
    container_name: backend
    ports:
      - "3000:3000"  
    networks:
      - app-network
    environment:
      - DATABASE_URL=postgres://prac1:prac1@db:3000/prac1 

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: prac1
      POSTGRES_PASSWORD: prac1
      POSTGRES_DB: prac1
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/test:/docker-entrypoint-initdb.d
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@root.by
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - app-network

networks:
  app-network:

volumes:
  db-data: