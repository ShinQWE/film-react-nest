services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/shinqwe/film-react-nest/frontend:latest
    container_name: frontend
    networks:
      - webnet
    volumes:
      - frontend_dist:/var/www/frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/shinqwe/film-react-nest/backend:latest
    container_name: backend
    networks:
      - webnet
    ports:
      - "3000:3000"  
    environment:
      - DATABASE_URL=postgres://prac1:prac1@db:5432/prac1
    command: ["sh", "-c", "sleep 10 && npm start"]

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: prac1
      POSTGRES_PASSWORD: prac1
      POSTGRES_DB: prac1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnet

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@root.by
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - webnet

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/shinqwe/film-react-nest/nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - frontend_dist:/var/www/frontend
    networks:
      - webnet

volumes:
  frontend_dist:
  postgres_data:

networks:
  webnet:
    driver: bridge